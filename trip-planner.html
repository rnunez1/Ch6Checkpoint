<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Planner - Ramon's Travel Blog</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1><img class="icon" src="images/icons-sprite.jpg" alt="">Ramon's Travel Blog</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="destinations.html">Destinations</a></li>
        <li><a href="trip-planner.html">Trip Planner</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Plan Your Trip</h2>
    <form action="#" method="post">
      <label for="destination">Destination</label>
      <select id="destination" name="destination">
        <option value="paris">Paris</option>
        <option value="bali-beaches">Bali Beaches</option>
        <option value="bali-mountains">Bali Mountains</option>
      </select>

      <label for="start">Start date</label>
      <input type="date" id="start" name="start">

      <label for="end">End date</label>
      <input type="date" id="end" name="end">

      <label for="travelers">Number of travelers</label>
      <input type="number" id="travelers" name="travelers" min="1" value="1">

      <label for="notes">Notes</label>
      <textarea id="notes" name="notes" rows="4"></textarea>

      <button type="submit">Save Plan</button>
    </form>
  </main>

  <footer><p>&copy; 2026 Ramon's Travel Blog</p></footer>
</body>
</html>
